<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 20px; background: #00143f; font-family: -apple-system, Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; }
.toolbar { display: flex; align-items: center; background: #00143f; padding: 0 16px; border: 1px solid #335; border-radius: 8px; width: 380px; height: 64px; box-sizing: border-box; }
.logo-trans { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.logo-trans img { width: 44px; height: 44px; }
.logo-badge { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
.logo-badge img { width: 36px; height: 36px; }
.text-area { margin-left: 12px; color: white; flex-grow: 1; }
.title { font-size: 17px; font-weight: bold; }
.subtitle { font-size: 11px; color: #f5b335; }
.actions { display: flex; gap: 8px; color: white; font-size: 18px; }
</style>
</head>
<body>
  <div>
    <div style="color: #aaa; margin-bottom: 4px;">1. Transparent with White Ribbon + Subtle Highlight</div>
    <div class="toolbar">
      <div class="logo-trans"><img src="crest_glow.svg"></div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <div style="color: #aaa; margin-bottom: 4px;">2. Transparent with White Ribbon (Direct)</div>
    <div class="toolbar">
      <div class="logo-trans"><img src="crest_official_white_ribbon.svg"></div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <div style="color: #aaa; margin-bottom: 4px;">3. Pure White Circular Emblem Badge</div>
    <div class="toolbar">
      <div class="logo-badge"><img src="crest_official.svg"></div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>
</body>
</html>
