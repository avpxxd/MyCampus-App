<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 20px; background: #00143f; font-family: -apple-system, Roboto, sans-serif; display: flex; flex-direction: column; gap: 20px; }
.toolbar { display: flex; align-items: center; background: #00143f; padding: 0 16px; border: 1px solid #335; border-radius: 8px; width: 380px; height: 64px; box-sizing: border-box; }
.badge-gold-ring { width: 44px; height: 44px; background: white; border-radius: 50%; border: 1.5px solid #e5a939; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); flex-shrink: 0; }
.badge-gold-ring img { width: 36px; height: 36px; }
.badge-clean-white { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); flex-shrink: 0; }
.badge-clean-white img { width: 36px; height: 36px; }
.badge-rounded { width: 44px; height: 44px; background: white; border-radius: 10px; border: 1px solid #e5a939; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); flex-shrink: 0; }
.badge-rounded img { width: 36px; height: 36px; }
.text-area { margin-left: 12px; color: white; flex-grow: 1; }
.title { font-size: 17px; font-weight: bold; }
.subtitle { font-size: 11px; color: #f5b335; }
.actions { display: flex; gap: 8px; color: white; font-size: 18px; }
</style>
</head>
<body>
  <div>
    <div style="color: #aaa; margin-bottom: 4px;">Badge with StFX Gold Ring:</div>
    <div class="toolbar">
      <div class="badge-gold-ring"><img src="crest_official_white_ribbon.svg"></div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <div style="color: #aaa; margin-bottom: 4px;">Clean White Circular Badge:</div>
    <div class="toolbar">
      <div class="badge-clean-white"><img src="crest_official_white_ribbon.svg"></div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>
</body>
</html>
