<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 20px; background: #12121a; font-family: -apple-system, Roboto, sans-serif; display: flex; flex-direction: column; gap: 24px; }
.toolbar { display: flex; align-items: center; background: #00143f; padding: 0 16px; border-radius: 8px; width: 380px; height: 64px; box-sizing: border-box; }
.logo-container-circle { background: #ffffff; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.3); flex-shrink: 0; }
.logo-container-circle img { width: 36px; height: 36px; }
.logo-container-trans { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-container-trans img { width: 42px; height: 42px; }
.text-area { margin-left: 12px; color: white; flex-grow: 1; }
.title { font-size: 17px; font-weight: bold; }
.subtitle { font-size: 11px; color: #f5b335; margin-top: 1px; }
.actions { display: flex; gap: 8px; color: white; font-size: 18px; margin-left: 8px; }
</style>
</head>
<body>
  <div>
    <h4 style="color: #bbb; margin: 0 0 6px 4px;">Style A: Transparent Crest with White Ribbon</h4>
    <div class="toolbar">
      <div class="logo-container-trans">
        <img src="crest_official_white_ribbon.svg">
      </div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <h4 style="color: #bbb; margin: 0 0 6px 4px;">Style B: Circular White Badge Emblem</h4>
    <div class="toolbar">
      <div class="logo-container-circle">
        <img src="crest_official.svg">
      </div>
      <div class="text-area">
        <div class="title">StFX MyCampus</div>
        <div class="subtitle">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>
</body>
</html>
