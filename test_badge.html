.badge-img { width: 44px; height: 44px; }
.toolbar-mock { display: flex; align-items: center; background: #00143f; padding: 10px 16px; border-radius: 8px; width: 360px; height: 64px; }
.toolbar-text { margin-left: 12px; color: white; }
.toolbar-title { font-size: 17px; font-weight: bold; }
.toolbar-sub { font-size: 11px; color: #f5b335; }
</style>
</head>

  </div>
