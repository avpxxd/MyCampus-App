<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 20px; background: #f0f4f8; font-family: sans-serif; }
.card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.dark-card { background: #00143f; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
img { display: block; max-width: 100%; }
</style>
</head>
<body>
<div class="card">
  <h3>Original SVG (on white)</h3>
  <img src="stfx_official_logo.svg" style="height: 100px;">
</div>
<div class="dark-card">
  <h3 style="color: white;">Original SVG (on StFX navy #00143f)</h3>
  <img src="stfx_official_logo.svg" style="height: 100px;">
</div>
</body>
</html>
