<!DOCTYPE html>
<html>
<head>
<style>

.box-white { background: #ffffff; padding: 15px; border-radius: 8px; text-align: center; color: #00143f; }
img { width: 100px; height: 100px; display: block; margin: 10px auto; }
</style>
</head>
<body>
  <div class="box-navy">
    <h4>White Ribbon on Navy</h4>
    <img src="crest_official_white_ribbon.svg">
  </div>
  <div class="box-navy">
    <h4>Original on Navy</h4>
    <img src="crest_official.svg">
  </div>
  <div class="box-white">
    <h4>Original on White</h4>
    <img src="crest_official.svg">
  </div>
</body>
</html>
