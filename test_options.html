<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 20px; background: #1a1a24; font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; }
.toolbar-mock { display: flex; align-items: center; background: #00143f; padding: 10px 16px; border-radius: 8px; width: 400px; height: 64px; box-sizing: border-box; }
.badge-circle { background: #ffffff; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); flex-shrink: 0; }
.badge-squircle { background: #ffffff; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); flex-shrink: 0; }
.badge-img { width: 36px; height: 36px; }
.full-logo-badge { background: #ffffff; border-radius: 8px; height: 44px; padding: 4px 12px; display: flex; align-items: center; }
.full-logo-img { height: 36px; }
.toolbar-text { margin-left: 12px; color: white; flex-grow: 1; }
.toolbar-title { font-size: 16px; font-weight: bold; }
.toolbar-sub { font-size: 11px; color: #f5b335; }
.actions { display: flex; gap: 8px; color: white; font-size: 20px; }
</style>
</head>
<body>
  <div>
    <p style="color: #aaa; margin: 4px 0;">Option 1: Circular White Badge with Official Crest</p>
    <div class="toolbar-mock">
      <div class="badge-circle">
        <img src="stfx_crest_only.svg" class="badge-img">
      </div>
      <div class="toolbar-text">
        <div class="toolbar-title">StFX MyCampus</div>
        <div class="toolbar-sub">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <p style="color: #aaa; margin: 4px 0;">Option 2: Rounded Squircle Badge with Official Crest</p>
    <div class="toolbar-mock">
      <div class="badge-squircle">
        <img src="stfx_crest_only.svg" class="badge-img">
      </div>
      <div class="toolbar-text">
        <div class="toolbar-title">StFX MyCampus</div>
        <div class="toolbar-sub">St. Francis Xavier University</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>

  <div>
    <p style="color: #aaa; margin: 4px 0;">Option 3: Full Official Logo Badge (White Pill)</p>
    <div class="toolbar-mock">
      <div class="full-logo-badge">
        <img src="stfx_official_logo.svg" class="full-logo-img">
      </div>
      <div class="toolbar-text" style="text-align: right; margin-right: 12px;">
        <div class="toolbar-title" style="font-size: 14px; color: #f5b335;">MyCampus</div>
      </div>
      <div class="actions">🔄 ℹ️</div>
    </div>
  </div>
</body>
</html>
